# Temporary override for local dev on a host that already has Postgres
# running on 5432 (e.g. native install). Removes the compose `db`
# service and points api/simulator at the host postgres via
# host.docker.internal. Use this file alongside docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#
# When you're done, run:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml down
name: surakkha

services:
  db:
    profiles: [never]   # skip the built-in db service entirely

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-surakkha}:${POSTGRES_PASSWORD:-surakkha}@host.docker.internal:5432/${POSTGRES_DB:-surakkha}
      # F-W1: the api Dockerfile's runtime stage does not carry the
      # db package's `tsx`/`prisma` toolchain, so the api boot path's
      # `runMigrations()` would throw on a dynamic import of
      # `@surakkha/db/scripts/migrate`. Migrations are run from the
      # host before bringing the stack up; the api trusts that and
      # skips its own migration step.
      SKIP_MIGRATIONS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  simulator:
    extra_hosts:
      - "host.docker.internal:host-gateway"