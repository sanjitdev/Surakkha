        image: postgres:15
        env:
          POSTGRES_USER: surakkha
          POSTGRES_PASSWORD: surakkha
          POSTGRES_DB: surakkha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surakkha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://surakkha:surakkha@localhost:5432/surakkha_test
      JWT_SECRET: ci-secret-must-be-at-least-32-characters-long
      SIMULATOR_SECRET: ci-simulator-secret
