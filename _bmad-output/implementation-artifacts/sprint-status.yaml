# Surakkha — sprint status
# Last verified on 2026-08-21.
#
# Source of truth for which stories have shipped, which are in-flight,
# and which are pending. Produced by the BMAD per-story loop
# (docs/BMAD-METHOD.md). Read by `bmad-sprint-planning` (SS) for the
# readiness-gate + tracking view.
#
# Schema (per story):
#   id:        story id (e.g. "1.1", "1.2a", "1.9")
#   title:     one-line summary
#   status:    pending | in-progress | completed
#   epic:      parent epic (Epic 1 / Epic 2 / ...)
#   commit:    merge commit hash when status == completed
#   shipped:   ISO date when shipped (or null)
#   covers:    list of FR / NFR / UX-DR / I- references from epics.md
#   ledger:
#     context: path to stories/<id>.context.md (relative to project root)
#     review:  path to stories/<id>.review.md  (relative to project root)

