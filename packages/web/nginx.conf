# Surakkha Web — Nginx SPA config.
# Proxies /api/* to the api container and serves the SPA for everything else.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets emitted by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API reverse proxy.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Auth + refresh cookies — same-origin through the SPA.
  # The SPA's apiClient calls `${apiOrigin}/auth/login` and
  # `${apiOrigin}/auth/refresh` (see packages/web/src/api/apiClient.ts)
  # — NOT `/api/auth/...`. Without this proxy the login form would
  # 404 through nginx and the refresh-401 retry would never fire.
  location /auth/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Admin simulator / thresholds / users / schools API. The admin
  # SPA tabs call these via apiFetch("/admin/..."). Without this
  # block nginx's SPA fallback returns index.html (200 + HTML),
  # apiClient tries to JSON-parse it, fails, and the tab shows
  # "Failed to load …". The vite dev server config mirrors this
  # route — see packages/web/vite.config.ts.
  location /admin/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO handshake + transport for `/ingest/<device_id>` — the
  # v1 device ingest path. WS upgrade headers (`Upgrade` / `Connection`)
  # are required; `proxy_read_timeout 86400` keeps the long-lived
  # telemetry stream from being timed out by nginx's default 60s.
  location /ingest/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Socket.IO handshake + transport for `/dashboard` — the operator
  # realtime path used by the web SPA. Same WS upgrade rules as /ingest.
  location /dashboard/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Socket.IO engine — fallthrough polling transport that the WS
  # paths emit during the initial handshake (`/socket.io/?EIO=4&...`).
  # Without this block the upgrade fails with 400 before the WS path
  # even gets a chance to handle it.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Health probe passthrough.
  location = /health {
    proxy_pass http://api:3000/health;
  }

  # SPA fallback — every other path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
