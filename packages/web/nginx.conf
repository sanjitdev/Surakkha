# Surakkha Web — Nginx SPA config.
# Proxies /api/* to the api container and serves the SPA for everything else.

server {
  listen 80;
  server_name _;

  # Disable nginx-injected redirects so the SPA's `<BrowserRouter>`
  # pathname is what reaches the client. Without these flags,
  # `try_files $uri $uri/ /index.html` triggers a directory-index
  # lookup that 301s `/dashboard` → `/dashboard/`, corrupting the
  # route on reload and breaking bookmarks.
  absolute_redirect off;
  server_name_in_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets emitted by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API reverse proxy.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Auth + refresh cookies — same-origin through the SPA.
  # The SPA's apiClient calls `${apiOrigin}/auth/login` and
  # `${apiOrigin}/auth/refresh` (see packages/web/src/api/apiClient.ts)
  # — NOT `/api/auth/...`. Without this proxy the login form would
  # 404 through nginx and the refresh-401 retry would never fire.
  location /auth/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Admin SPA routes — serve the SPA shell for the bare admin paths
  # so React Router can mount the page BEFORE the api call fires.
  # Without these exact-match blocks, the `location /admin/` proxy
  # below intercepts the bare `/admin/simulator` etc. URIs (nginx
  # prefix matching captures them even without the trailing slash)
  # and proxies them to the api, which 401s — browsers then render
  # the raw JSON error and the SPA never gets a chance to mount.
  # Same pattern as `location = /dashboard` above. `location =` has
  # priority over prefix locations, so these win over the `/admin/`
  # proxy for the exact-match URIs; sub-paths like
  # `/admin/simulator/status` still match the prefix proxy and
  # forward to the api as intended.
  location = /admin/simulator      { try_files /index.html =404; }
  location = /admin/notifications { try_files /index.html =404; }
  location = /admin/thresholds    { try_files /index.html =404; }
  location = /admin/users         { try_files /index.html =404; }
  location = /admin/schools       { try_files /index.html =404; }

  # Admin simulator / thresholds / users / schools API. The admin
  # SPA tabs call these via apiFetch("/admin/..."). Without this
  # block nginx's SPA fallback returns index.html (200 + HTML),
  # apiClient tries to JSON-parse it, fails, and the tab shows
  # "Failed to load …". The vite dev server config mirrors this
  # route — see packages/web/vite.config.ts.
  location /admin/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO handshake + transport for `/ingest/<device_id>` — the
  # v1 device ingest path. WS upgrade headers (`Upgrade` / `Connection`)
  # are required; `proxy_read_timeout 86400` keeps the long-lived
  # telemetry stream from being timed out by nginx's default 60s.
  location /ingest/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Exact-match override for `/dashboard` (no trailing slash) —
  # serves the SPA so a reload of `/dashboard` lands on the React
  # route instead of being silently proxied to the api's `/dashboard`
  # namespace (which 401s without a JWT). `location =` has priority
  # over prefix locations, so this beats `location /dashboard/`.
  # Without this block, nginx's prefix matching on `/dashboard/`
  # captures the bare `/dashboard` URI even with `absolute_redirect
  # off` and proxies it — the SPA's `<BrowserRouter>` pathname never
  # reaches the client. The `location /dashboard/` block below still
  # matches `/dashboard/ingest/?...` (the real Socket.IO URL).
  location = /dashboard {
    try_files /index.html =404;
  }

  # Socket.IO handshake + transport for `/dashboard/...` — the
  # operator realtime path used by the web SPA. The exact-match block
  # above intercepts bare `/dashboard` so this prefix block only
  # fires for `/dashboard/ingest/?...` (the real Socket.IO URL).
  # Same WS upgrade rules as /ingest.
  location /dashboard/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Socket.IO engine — fallthrough polling transport that the WS
  # paths emit during the initial handshake (`/socket.io/?EIO=4&...`).
  # Without this block the upgrade fails with 400 before the WS path
  # even gets a chance to handle it.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Health probe passthrough.
  location = /health {
    proxy_pass http://api:3000/health;
  }

  # SPA fallback — every other path serves index.html. The `$uri/`
  # fallback was removed: it triggers a directory-index lookup that
  # 301s `/dashboard` → `/dashboard/`, breaking the SPA's `<Router>`
  # pathname on reload (see the `absolute_redirect off` block above).
  location / {
    try_files $uri /index.html;
  }
}
